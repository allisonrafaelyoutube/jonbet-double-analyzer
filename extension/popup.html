<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 280px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #12161d;
      color: #e8eaed;
      padding: 14px;
    }
    h1 { font-size: 13px; margin: 0 0 12px; }
    .row { font-size: 12px; color: #9aa3af; margin: 5px 0; line-height: 1.35; }
    .ok { color: #3ddc97; }
    .bad { color: #ff6b6b; }
    .warn { color: #f0b429; }
    .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    a, button {
      display: inline-block;
      background: #3ddc97;
      color: #042015;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-size: 12px;
    }
    button.secondary {
      background: transparent;
      color: #e8eaed;
      border: 1px solid #2a313c;
    }
  </style>
</head>
<body>
  <h1>Jonbet Double Analyzer</h1>
  <div class="row" id="server">Servidor: …</div>
  <div class="row" id="page">Página: …</div>
  <div class="row" id="ping">Sync: …</div>
  <div class="row" id="err"></div>
  <div class="actions">
    <a href="http://127.0.0.1:8787/" target="_blank" rel="noreferrer">Dashboard</a>
    <button class="secondary" id="recheck" type="button">Atualizar</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
